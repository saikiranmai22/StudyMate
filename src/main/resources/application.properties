spring.application.name=studymate
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3307/studymate_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
#The secret must be a securely generated Base64-encoded key of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000 

# Multipart file upload limits
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=22MB

# Local file storage
app.storage.location=${user.home}/studymate-uploads

# Gemini API
gemini.api-key=${GEMINI_API_KEY:}

# Embedding configuration
gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimensions=768